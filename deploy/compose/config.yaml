# Config used by compose.yaml (mounted at /config/config.yaml; edits are picked up live).
# yaml-language-server: $schema=../../schema/config.schema.json
branding:
  productName: { en: Acme XR Rooms, ja: Acme XR ルーム }
  logo: /room-assets/logo.svg
  accentColor: "#0a7cff"

assets:
  dir: /assets

voice:
  # With `docker compose --profile turn up`, uncomment to relay voice through the local coturn:
  # turn:
  #   urls: ["turn:localhost:3478?transport=udp", "turn:localhost:3478?transport=tcp"]
  #   secretEnv: TURN_SECRET

rooms:
  allowAdhoc: true
  list:
    - id: design-review
      title: { en: Design review, ja: デザインレビュー }
      template: product-demo
    - id: kickoff
      title: { en: Project kick-off, ja: キックオフ }
      template: workshop
    - id: town-hall
      title: { en: Town hall, ja: 全体会議 }
      template: presentation

templates:
  - id: product-demo
    extends: round-table
    title: { en: Product demo, ja: 製品デモ }
    environment: { background: "#1f2430", floor: plain, floorColor: "#2b3140" }
    addObjects:
      - id: drone
        kind: model
        position: [0, 0.02, 0.4]
        model: { src: /room-assets/drone.glb, scale: 1.2 }
