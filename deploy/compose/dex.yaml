# Demo identity provider for sso.compose.yaml. Do not use in production.
issuer: http://localhost:5556/dex
storage: { type: memory }
web: { http: 0.0.0.0:5556 }
oauth2: { skipApprovalScreen: true }
enablePasswordDB: true
staticClients:
  - id: colo
    name: web-colocation
    secret: colo-demo-secret
    redirectURIs: [http://localhost:4180/oauth2/callback]
staticPasswords:
