# Local test cluster (kind). Used by scripts/kind-smoke.sh.
image:
  repository: web-colocation
  tag: dev
  pullPolicy: Never

config:
  branding:
    productName: Local XR Rooms
  server:
    csp: enforce

persistence:
  enabled: true
  size: 100Mi

resources:
  requests: { cpu: 50m, memory: 64Mi }
