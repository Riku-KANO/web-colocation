{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "web-colocation.fullname" . }}
  labels:
    {{- include "web-colocation.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "web-colocation.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    # Public traffic only reaches the proxy (with SSO) or the app port.
    - ports:
        - port: {{ ternary 4180 8080 .Values.oauth2Proxy.enabled }}
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    # Health and metrics port (kubelet probes and Prometheus).
    - ports:
        - port: 8081
{{- end }}
