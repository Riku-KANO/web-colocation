{{- if and .Values.turn.secret (not .Values.turn.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "web-colocation.turnSecretName" . }}
  labels:
    {{- include "web-colocation.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.turn.secretKey }}: {{ .Values.turn.secret | quote }}
{{- end }}
{{- if and .Values.oauth2Proxy.enabled (not .Values.oauth2Proxy.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "web-colocation.oauth2SecretName" . }}
  labels:
    {{- include "web-colocation.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-secret: {{ required "oauth2Proxy.clientSecret (or oauth2Proxy.existingSecret) is required" .Values.oauth2Proxy.clientSecret | quote }}
  cookie-secret: {{ include "web-colocation.cookieSecret" . | quote }}
{{- end }}
