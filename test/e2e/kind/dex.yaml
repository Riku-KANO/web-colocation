# Test-only identity provider for scripts/kind-smoke.sh (static user alice@example.com / password).
apiVersion: v1
kind: ConfigMap
metadata:
  name: dex
data:
  config.yaml: |
    issuer: http://dex.colo-smoke.svc.cluster.local:5556/dex
    storage: { type: memory }
    web: { http: 0.0.0.0:5556 }
    oauth2: { skipApprovalScreen: true }
    enablePasswordDB: true
    staticClients:
      - id: colo
        name: web-colocation
        secret: colo-test-secret
        redirectURIs: [http://colo-sso-web-colocation.colo-smoke.svc.cluster.local/oauth2/callback]
    staticPasswords:
      - email: alice@example.com
        # bcrypt("password")
        hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
        username: alice
        userID: 08a8684b-db88-4b73-90a9-3cd1661f5466
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
spec:
  replicas: 1
  selector: { matchLabels: { app: dex } }
  template:
    metadata: { labels: { app: dex } }
    spec:
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.45.0
          args: [dex, serve, /etc/dex/config.yaml]
          ports: [{ containerPort: 5556 }]
          volumeMounts: [{ name: config, mountPath: /etc/dex }]
          readinessProbe: { httpGet: { path: /dex/healthz, port: 5556 } }
      volumes:
        - name: config
          configMap: { name: dex }
---
apiVersion: v1
kind: Service
metadata:
  name: dex
spec:
  selector: { app: dex }
  ports: [{ port: 5556, targetPort: 5556 }]
